<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Purchase of Stamps — MeeSeva Telangana</title>
  <style>
    :root{color-scheme:dark;--bg:#101318;--panel:#1b2028;--muted:#9aa4b2;--line:#303844;--brand:#147bff;--green:#15b87a}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f4f7fb;font:15px/1.55 Inter,system-ui,sans-serif;display:flex;justify-content:center;min-height:100vh}
    .app{width:min(100%,620px);height:100vh;display:flex;flex-direction:column;background:#151920;box-shadow:0 0 40px #0008}.header{height:68px;display:flex;align-items:center;gap:12px;padding:12px 18px;background:#202631;border-bottom:1px solid var(--line)}.avatar,.welcome-logo{width:40px;height:40px;border-radius:50%;object-fit:cover}.header h1{font-size:16px;margin:0}.header p{color:var(--muted);font-size:12px;margin:1px 0 0}.chat{flex:1;overflow:auto;padding:18px 14px 28px;background:linear-gradient(#17202a,#11151c)}.datepill,.notice{width:max-content;margin:0 auto 12px;color:var(--muted);font-size:11px}.notice{max-width:92%;text-align:center;background:#202733;padding:7px 12px;border-radius:10px}.row{display:flex;margin:10px 0}.row.in{justify-content:flex-start}.row.out{justify-content:flex-end}.bubble{max-width:88%;white-space:pre-line;background:#222a35;border:1px solid #323b49;border-radius:15px;padding:11px 13px;box-shadow:0 4px 16px #0002}.out .bubble{background:#0d5fc8;border-color:#2478df}.meta{display:flex;justify-content:flex-end;gap:7px;color:#aab7c7;font-size:10px;margin-top:5px}.cta-row{margin:12px -13px -11px;padding:10px;text-align:center;color:#58a5ff;border-top:1px solid var(--line);cursor:pointer;font-weight:650}.svc-title{font-weight:700}.welcome-logo{display:block;margin-bottom:8px}.flow-scrim,.pick-scrim{position:fixed;inset:0;background:#0009;display:none;z-index:5}.flow-scrim.show,.pick-scrim.show{display:block}.flow,.picker,.pay{position:fixed;z-index:6;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,460px);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 20px 70px #000b;display:none}.flow.show,.picker.show,.pay.show{display:block}.flow-head{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}.flow-head h3{flex:1;margin:0;font-size:17px}.flow-nav{border:0;background:none;color:#fff;font-size:22px;cursor:pointer}.flow-body{padding:18px}.flow-foot{padding:14px 18px;border-top:1px solid var(--line)}.flow-primary{width:100%;padding:12px;border:0;border-radius:10px;background:var(--brand);color:white;font-weight:700;cursor:pointer}.flow-primary:disabled{opacity:.45;cursor:not-allowed}.flow-hero,.banner-img{width:100%;border-radius:12px;display:block;margin-bottom:14px;max-height:190px;object-fit:cover}.field{margin:14px 0}.flabel{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}.box{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:#11161d;color:#fff}.dropdown .box{display:flex;justify-content:space-between;cursor:pointer}.ph{color:#778292}.totalhint{color:#7de1b7;background:#123528;padding:10px;border-radius:9px}.picker{padding:18px}.picker h3{margin:0 0 12px}.pitem,.pmethod{display:flex;justify-content:space-between;padding:13px;border-bottom:1px solid var(--line);cursor:pointer}.pitem.sel,.pmethod.sel{color:#66adff}.radio,.r{width:18px;height:18px;border:2px solid #647184;border-radius:50%}.sel .radio,.sel .r{border-color:var(--brand);background:radial-gradient(circle,var(--brand) 45%,transparent 50%)}.pay{padding:20px}.pay h2{margin:0 0 6px}.pay-amount{font-size:28px;font-weight:800;margin-bottom:14px}.disc{font-size:11px;color:var(--muted);margin:18px 0}.pactions{display:flex;justify-content:flex-end;gap:18px}.pactions a{color:#62aaff;cursor:pointer}.upi-head{font-size:17px;font-weight:700}.tag{background:#6b3fc7;padding:3px 8px;border-radius:5px;font-size:11px;margin-right:8px}.apps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}.app{display:flex;flex-direction:column;align-items:center;gap:5px;padding:12px 4px;border:1px solid var(--line);border-radius:10px;cursor:pointer}.g{height:28px;font-size:22px;display:flex;align-items:center}.pay-spin{display:none;text-align:center;color:var(--muted);padding:18px}.pay-spin.show{display:block}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#26313f;padding:10px 16px;border-radius:9px;display:none;z-index:10}.toast.show{display:block}.challanimg{width:100%;max-height:240px;object-fit:contain;background:#fff;border-radius:8px;margin-bottom:10px}
  </style>
</head>
<body>
  <main class="app">
    <header class="header"><div id="hAvatar" class="avatar"></div><div><h1>MeeSeva Telangana</h1><p>Business chat service</p></div></header>
    <section id="chat" class="chat" aria-live="polite"></section>
  </main>
  <div id="flowScrim" class="flow-scrim"></div><section id="flow" class="flow"><div class="flow-head"><button id="flowNav" class="flow-nav" aria-label="Close">✕</button><h3 id="flowTitle"></h3></div><div id="flowBody" class="flow-body"></div><div class="flow-foot"><button id="flowPrimary" class="flow-primary"></button></div></section>
  <div id="pickScrim" class="pick-scrim"></div><section id="picker" class="picker"><h3 id="pickTitle"></h3><div id="pickList"></div></section>
  <section id="pay" class="pay"><h2>Secure Payment</h2><div class="pay-amount">₹<span id="payAmt">0</span></div><div id="payBody"></div><div id="paySpin" class="pay-spin">Processing payment…</div></section>
  <div id="toast" class="toast" role="status"></div><div id="mAvatar" hidden></div>
  <script src="./purchase-of-stamps-meta-flow-download.js"></script>
</body>
</html>
